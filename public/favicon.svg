<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Circle Background for Clean Favicon Rendering -->
  <rect width="500" height="500" rx="100" fill="#030712"/>

  <!-- Outer Shield Shell -->
  <path 
    d="M 250,55 L 380,115 L 362,295 L 250,425 L 138,295 L 120,115 Z" 
    fill="#090d16" 
    stroke="url(#shieldBorder)" 
    stroke-width="16" 
    stroke-linejoin="round" 
  />

  <!-- Inner Shield Ring -->
  <path 
    d="M 250,78 L 358,128 L 342,280 L 250,398 L 158,280 L 142,128 Z" 
    fill="#0f172a" 
    stroke="#1e293b" 
    stroke-width="8" 
    stroke-linejoin="round" 
  />

  <!-- Katana Handle (Tsuka) extending from back right -->
  <g transform="translate(315, 150) rotate(-35)">
    <rect x="0" y="40" width="45" height="10" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <rect x="10" y="-30" width="25" height="70" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <path d="M 10,-20 L 35,-10 M 10,0 L 35,10 M 10,20 L 35,30" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <rect x="8" y="-38" width="29" height="8" rx="2" fill="#38bdf8" />
  </g>

  <!-- Samurai Character Torso -->
  <path 
    d="M 180,350 C 200,315 230,295 250,295 C 270,295 300,315 320,350 L 340,380 L 160,380 Z" 
    fill="#e2e8f0" 
  />
  <path 
    d="M 210,308 L 250,355 L 290,308 Z" 
    fill="#0f172a" 
  />

  <!-- Samurai Conical Kasa Hat -->
  <g>
    <path 
      d="M 250,140 L 380,265 C 318,290 182,290 120,265 Z" 
      fill="#1e293b" 
      stroke="#38bdf8" 
      stroke-width="12" 
      stroke-linejoin="round" 
    />
    <path d="M 250,145 L 210,272" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <path d="M 250,145 L 260,276" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <path d="M 250,145 L 310,270" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <path d="M 140,263 C 200,280 300,280 360,263 C 320,305 180,305 140,263 Z" fill="#090d16" />
    <!-- Glowing Cyan Visor -->
    <path d="M 205,275 Q 250,284 295,275" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#glowEffect)" />
  </g>

  <!-- Bottom KAIZEN Banner Box -->
  <rect 
    x="110" 
    y="390" 
    width="280" 
    height="65" 
    rx="12" 
    fill="#090d16" 
    stroke="#38bdf8" 
    stroke-width="8" 
  />
  <text 
    x="250" 
    y="435" 
    text-anchor="middle" 
    fill="#38bdf8" 
    font-size="40" 
    font-weight="900" 
    font-family="system-ui, -apple-system, sans-serif" 
    letter-spacing="2"
  >
    KAIZEN
  </text>
</svg>
