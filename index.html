    <!-- Early Performance API Guard (Prevents DataCloneError on performance.measure in React 19) -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.performance && typeof window.performance.measure === 'function') {
          var perf = window.performance;
          var origMeasure = perf.measure.bind(perf);
          var count = 0;
          perf.measure = function(name, opts, endMark) {
            try {
              count++;
              if (count > 150) {
                count = 0;
                if (typeof perf.clearMeasures === 'function') perf.clearMeasures();
                if (typeof perf.clearMarks === 'function') perf.clearMarks();
              }
              return origMeasure(name, opts, endMark);
            } catch (e) {
              try {
                if (opts && typeof opts === 'object') {
                  var safe = {};
                  for (var k in opts) { if (k !== 'detail') safe[k] = opts[k]; }
                  return origMeasure(name, safe, endMark);
                }
              } catch (e2) {
                try { return origMeasure(name); } catch (e3) { return undefined; }
              }
              return undefined;
            }
          };
          window.addEventListener('error', function(e) {
            if (e && e.message && (e.message.indexOf("Failed to execute 'measure' on 'Performance'") !== -1 || e.message.indexOf("Data cannot be cloned") !== -1)) {
              e.preventDefault();
              e.stopPropagation();
              return true;
            }
          });
        }
      })();
    </script>
